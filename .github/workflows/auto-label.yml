name: Auto Label

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label PR by changed section
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const SECTION_LABELS = {
              'Official Resources': 'documentation',
              'Formatters & Reporters': 'formatters',
              'Integrations': 'integrations',
              'Parallel Execution': 'tooling',
              'Tooling': 'tooling',
              'CI/CD Integrations': 'ci-cd',
              'IDE & Editor Support': 'ide-editor',
              'Learning Resources': 'learning',
              'Community Projects & Examples': 'community',
              'Related Awesome Lists': 'community',
            };
            const FALLBACK_LABEL = 'documentation';
            const MANAGED = new Set([...Object.values(SECTION_LABELS), 'infrastructure', FALLBACK_LABEL]);

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const labels = new Set();

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            let headLines = [];
            if (files.some(f => f.filename === 'README.md' && f.patch)) {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: 'README.md', ref: pr.head.sha,
              });
              headLines = Buffer.from(data.content, 'base64').toString('utf8').split('\n');
            }

            for (const file of files) {
              if (file.filename === 'README.md' && file.patch) {
                let newLine = 0;
                for (const line of file.patch.split('\n')) {
                  const hunk = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                  if (hunk) {
                    newLine = parseInt(hunk[1], 10) - 1;
                    continue;
                  }
                  if (line.startsWith('+')) {
                    newLine++;
                    for (let j = newLine - 1; j >= 0; j--) {
                      const header = headLines[j] && headLines[j].match(/^##\s+(.+)$/);
                      if (header) {
                        labels.add(SECTION_LABELS[header[1].trim()] ?? FALLBACK_LABEL);
                        break;
                      }
                    }
                  } else if (!line.startsWith('-')) {
                    newLine++;
                  }
                }
              } else if (file.filename.startsWith('.github/') || file.filename.startsWith('scripts/')) {
                labels.add('infrastructure');
              } else if (file.filename !== 'README.md') {
                labels.add(FALLBACK_LABEL);
              }
            }

            const repoLabels = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner, repo, per_page: 100,
              })).map(l => l.name)
            );
            for (const name of labels) {
              if (!repoLabels.has(name)) {
                await github.rest.issues.createLabel({ owner, repo, name });
              }
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: [...labels],
              });
            }

            const stale = pr.labels
              .map(l => l.name)
              .filter(name => MANAGED.has(name) && !labels.has(name));
            for (const name of stale) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name,
              });
            }
